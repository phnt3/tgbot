<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Локальная панель управления компьютером">
<title>PC Panel</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<a class="skip-link" href="#view">К содержимому</a>

<div id="boot" class="boot">
  <div class="boot-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  </div>
  <p>Загрузка панели…</p>
</div>

<div id="auth" class="auth" hidden></div>

<div id="shell" class="shell" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Меню"></aside>

  <div class="main">
    <header class="topbar">
      <button id="menu-btn" class="iconbtn topbar-menu" aria-label="Открыть меню">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="topbar-titles">
        <h1 id="page-title">Обзор</h1>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-actions">
        <span id="tg-badge" class="badge subtle" title="Состояние Telegram-бота"></span>
        <button id="refresh-btn" class="iconbtn" title="Обновить" aria-label="Обновить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button id="theme-btn" class="iconbtn" title="Сменить тему" aria-label="Сменить тему">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="scrim" class="scrim" hidden></div>
</div>

<nav id="bottomnav" class="bottomnav" aria-label="Быстрая навигация" hidden></nav>

<div id="sheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-sheet-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheet-title">Ещё</h2>
      <button class="iconbtn" data-sheet-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
